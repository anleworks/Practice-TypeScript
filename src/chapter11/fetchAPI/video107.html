<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blogs</title>
    <style>
      /* Cấu hình chung cho bảng */
      #blog-data {
        width: 100%;
        max-width: 1000px;
        margin: 20px auto;
        border-collapse: collapse;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-size: 15px;
        background-color: #ffffff;
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border-radius: 8px;
        overflow: hidden; /* Bo tròn góc cho bảng */
      }

      /* Kiểu dáng cho phần đầu bảng (Header) */
      #blog-data thead tr {
        background-color: #0f172a; /* Màu xanh đen hiện đại */
        color: #ffffff;
        text-align: left;
        font-weight: 600;
      }

      #blog-data th,
      #blog-data td {
        padding: 14px 18px;
      }

      #blog-data th {
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 0.5px;
      }

      /* Đường gạch ngang giữa các hàng */
      #blog-data tbody tr {
        border-bottom: 1px solid #e2e8f0;
        transition: background-color 0.2s ease;
      }

      /* Xen kẽ màu hàng (Zebra striping) cho dễ đọc */
      #blog-data tbody tr:nth-of-type(even) {
        background-color: #f8fafc;
      }

      /* Hiệu ứng hover khi rê chuột qua hàng */
      #blog-data tbody tr:hover {
        background-color: #f1f5f9;
      }

      /* Tùy chỉnh cột cuối (hàng cuối cùng không cần border) */
      #blog-data tbody tr:last-of-type {
        border-bottom: 2px solid #0f172a;
      }

      /* Giới hạn độ rộng cho cột Content nếu nội dung quá dài */
      #blog-data td:nth-child(4) {
        max-width: 300px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <h1>Thực hành Fetch API vs TypeScript</h1>
    <h3>Blogs</h3>
    <table id="blog-data">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Content</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script
      type="module"
      src="../../../dist/chapter11/fetchAPI/video107.js"
    ></script>
  </body>
</html>
